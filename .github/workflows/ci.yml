name: CI

# The code runs on a pinned language. pin.xon names a verified amalgam
# (boot/he.x) from an x-lang release, and deps.lock.xon records that
# release's tag, its ISA fingerprint, the amalgam's digest, and the digest
# of every module vendored into the overlay.
#
# An amalgam pairs with the engine from its own release, so CI installs the
# engine from exactly the tag the lock names -- the guard below fails if
# the two drift apart. The overlay is then verified against its lock.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  X_LANG_VERSION: "v0.5.1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Engine matches the lock
        run: |
          locked=$(sed -n 's/^(release "\(.*\)")$/\1/p' deps.lock.xon)
          echo "lock: $locked   ci: $X_LANG_VERSION"
          [ "$locked" = "$X_LANG_VERSION" ] || {
            echo "FAIL: the engine CI installs is not the release the boot pin names"; exit 1; }

      - name: Install x from that release
        run: |
          base="https://github.com/jonruttan/x-lang/releases/download/${X_LANG_VERSION}"
          curl -fsSLO "${base}/x-${X_LANG_VERSION}-linux-x86_64.tar.gz"
          curl -fsSLO "${base}/x-${X_LANG_VERSION}-linux-x86_64.tar.gz.sha256"
          sha256sum -c "x-${X_LANG_VERSION}-linux-x86_64.tar.gz.sha256"
          tar xzf "x-${X_LANG_VERSION}-linux-x86_64.tar.gz"
          # Absolute path: the relocatable wrapper resolves its tree from $0.
          echo "$PWD/x-${X_LANG_VERSION}/bin" >> "$GITHUB_PATH"

      # (Pin check) is blocked on x-lang#223: with the project root listed
      # first (required so the repo's own modules aren't shadowed), the pin
      # verbs treat "." as the overlay and flag project files as unlisted.
      # Until that's fixed, verify the vendored tree directly.
      - name: Overlay matches its lock
        run: |
          cat > run-verify.x <<'XEOF'
          (import x/tool/pin)
          (display "verify: ") (display (Pin verify "deps"))
          (newline)
          XEOF
          x -f run-verify.x | tee verify-out.txt
          rm -f run-verify.x
          grep -qE "verify: [0-9]+" verify-out.txt || { echo "FAIL: overlay drifted from its lock"; exit 1; }

      - name: Tests
        run: |
          rc=0
          for t in tests/*.x; do
            printf '%s: ' "$t"
            if out=$(x -f "$t" 2>&1) && [ "$(printf '%s' "$out" | tail -1)" = "#t" ]; then
              echo ok
            else
              echo FAIL; printf '%s\n' "$out"; rc=1
            fi
          done
          exit $rc

      - name: The pins were actually armed
        run: |
          x -f tests/grid.x 2> err.txt >/dev/null
          grep -q "pinned: "      err.txt || { echo "FAIL: overlay pin not armed"; exit 1; }
          grep -q "pinned boot: " err.txt || { echo "FAIL: boot pin not armed"; exit 1; }
